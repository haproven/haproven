name: Update Haproven Frame

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-frame:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Haproven Frame
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          OWNER = "haproven"
          REPO = "haproven"
          README = Path("README.md")

          START = "<!-- HAPROVEN-FRAME:START -->"
          END = "<!-- HAPROVEN-FRAME:END -->"

          url = (
              f"https://api.github.com/repos/"
              f"{OWNER}/{REPO}/contributors?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Haproven-Frame"
              }
          )

          with urllib.request.urlopen(request) as response:
              contributors = json.load(response)

          # Only GitHub users, not anonymous contributors
          contributors = [
              user for user in contributors
              if user.get("type") == "User"
              and user.get("login")
              and user.get("avatar_url")
              and user.get("html_url")
          ]

          frame = [
              '<p align="center">',
              ''
          ]

          for user in contributors:
              username = user["login"]
              profile = user["html_url"]
              avatar = user["avatar_url"]

              frame.append(
                  f'<a href="{profile}" '
                  f'title="{username} — Haproven Contributor">'
              )

              frame.append(
                  f'  <img src="{avatar}" '
                  f'width="90" '
                  f'height="90" '
                  f'loading="lazy" '
                  f'alt="{username} — Haproven Contributor">'
              )

              frame.append("</a>")
              frame.append("")

          frame.append("</p>")

          generated_frame = "\n".join(frame)

          content = README.read_text(encoding="utf-8")

          if START not in content:
              raise SystemExit(
                  "HAPROVEN-FRAME:START marker not found in README.md"
              )

          if END not in content:
              raise SystemExit(
                  "HAPROVEN-FRAME:END marker not found in README.md"
              )

          start = content.index(START) + len(START)
          end = content.index(END)

          new_content = (
              content[:start]
              + "\n\n"
              + generated_frame
              + "\n\n"
              + content[end:]
          )

          README.write_text(
              new_content,
              encoding="utf-8"
          )

          print(
              f"Haproven Frame updated with "
              f"{len(contributors)} contributors."
          )
          PY

      - name: Commit updated Frame
        run: |
          git config user.name "Haproven Frame Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No Frame changes."
          else
            git commit -m "chore: update Haproven Frame"
            git push
          fi
