<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haproven Projects</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
        }

        .heading {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* Projects Grid System */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Individual Card Styling */
        .project-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .project-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .project-info h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }

        .project-btn {
            display: inline-block;
            padding: 8px 18px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .project-btn:hover {
            background-color: #0056b3;
        }

        .error-msg {
            color: #d9534f;
            background: #fdf7f7;
            padding: 15px;
            border: 1px solid #d9534f;
            border-radius: 8px;
            text-align: center;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <h1 class="heading">Our Global Projects</h1>

    <!-- Projects Yahan Display Honge -->
    <div id="projects-container" class="projects-grid">
        <p style="text-align: center; grid-column: 1/-1;">Loading Projects...</p>
    </div>

    <!-- External JS Link -->
    <script src="script.js"></script>

</body>
</html>
