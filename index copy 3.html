     Additional SEO
========================= -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f7fb;
            color: #15171a;
        }

        /* =========================================
           FRAME
        ========================================= */

        .haproven-frame {
            width: 100%;
            max-width: 1100px;
            padding: 55px 30px;

            background: #ffffff;

            border: 1px solid #e7e9ee;
            border-radius: 28px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .08);

            text-align: center;
        }


        /* =========================================
           HEADER
        ========================================= */

        .frame-label {
            display: inline-block;

            margin-bottom: 12px;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #667085;
        }


        .haproven-frame h1 {

            margin: 0;

            font-size:
                clamp(32px, 6vw, 52px);

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -1.5px;
        }


        .frame-description {

            max-width: 650px;

            margin:
                16px auto 0;

            color: #667085;

            font-size: 16px;

            line-height: 1.7;
        }


        /* =========================================
           CONTRIBUTORS
        ========================================= */

        .haproven-frame-grid {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 22px;

            margin-top: 45px;

            min-height: 100px;
        }


        /* =========================================
           MEMBER
        ========================================= */

        .haproven-member {

            position: relative;

            display: block;

            width: 92px;
            height: 92px;

            flex: 0 0 92px;

            border-radius: 50%;

            overflow: hidden;

            background: #eef1f5;

            border: 3px solid #ffffff;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, .12);

            transition:
                transform .35s ease,
                box-shadow .35s ease;
        }


        .haproven-member::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, .35),
                    transparent);

            pointer-events: none;
        }


        .haproven-member:hover {

            transform:
                translateY(-10px) scale(1.08);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .18);

            z-index: 2;
        }


        .haproven-member img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =========================================
           LOADING
        ========================================= */

        .frame-loading {

            width: 100%;

            padding: 30px;

            color: #667085;

            font-size: 14px;
        }


        .loading-dot {

            display: inline-block;

            width: 8px;
            height: 8px;

            margin: 0 3px;

            border-radius: 50%;

            background: currentColor;

            animation:
                loading 1s infinite ease-in-out;
        }


        .loading-dot:nth-child(2) {
            animation-delay: .15s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: .3s;
        }


        @keyframes loading {

            0%,
            80%,
            100% {
                transform: scale(.5);
                opacity: .4;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* =========================================
           FOOTER
        ========================================= */

        .frame-footer {

            margin-top: 40px;

            color: #667085;

            font-size: 14px;

            line-height: 1.7;
        }


        .frame-footer a {

            color: inherit;

            font-weight: 700;

            text-decoration: none;
        }


        .frame-footer a:hover {

            text-decoration: underline;
        }


        .frame-brand {

            margin-top: 8px;

            font-weight: 800;

            color: #15171a;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .haproven-frame {

                padding:
                    40px 15px;

                border-radius: 22px;
            }

            .haproven-member {

                width: 70px;
                height: 70px;

                flex-basis: 70px;
            }

            .haproven-frame-grid {

                gap: 15px;
            }

        }
    </style>

</head>






<body>


    <main class="haproven-frame" id="haprovenFrameSection">

        <span class="frame-label">
            HAPROVEN COMMUNITY
        </span>


        <h1>
            🖼️ Haproven Frame
        </h1>


        <p class="frame-description">
            The people behind Haproven —
            developers, builders and contributors
            helping the community grow.
        </p>


        <!-- Contributors -->

        <div class="haproven-frame-grid" id="haprovenFrame">

            <div class="frame-loading">

                Loading contributors

                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>

            </div>

        </div>


        <!-- Footer -->

        <div class="frame-footer">

            <a href="https://github.com/haproven/haproven/graphs/contributors" target="_blank"
                rel="noopener noreferrer">
                View all Haproven contributors →
            </a>

            <div class="frame-brand">
                🚀 HAPROVEN — Where Ideas Get Proven.
            </div>

        </div>

    </main>






    <script>
        /* =========================================================
           HAPROVEN FRAME
           GitHub Contributors + Name + Bio
        
           Features:
           - GitHub Contributors
           - Real Name
           - GitHub Username
           - GitHub Bio
           - Avatar
           - Contributions
           - Long-term Local Cache
           - API failure protection
           - No unnecessary API requests
        ========================================================= */

        (function () {

            "use strict";


            /* =====================================================
               CONFIG
            ===================================================== */

            const REPOSITORY = "haproven/haproven";

            const frame =
                document.getElementById("haprovenFrame");


            /*
             * Contributors list cache
             *
             * 24 hours
             */
            const CONTRIBUTORS_CACHE =
                "haproven_frame_contributors_v3";

            const CONTRIBUTORS_CACHE_TIME =
                24 * 60 * 60 * 1000;


            /*
             * Individual GitHub profile cache
             *
             * 7 days
             *
             * Name / Bio generally do not need
             * to be requested every day.
             */
            const PROFILE_CACHE_PREFIX =
                "haproven_frame_profile_v3_";

            const PROFILE_CACHE_TIME =
                7 * 24 * 60 * 60 * 1000;


            /* =====================================================
               SAFETY
            ===================================================== */

            if (!frame) {

                console.error(
                    "Haproven Frame: #haprovenFrame not found."
                );

                return;
            }


            /* =====================================================
               CACHE HELPERS
            ===================================================== */

            function readCache(key) {

                try {

                    const value =
                        localStorage.getItem(key);

                    if (!value) {
                        return null;
                    }

                    return JSON.parse(value);

                }
                catch (error) {

                    console.warn(
                        "Haproven Frame: Cache read failed.",
                        error
                    );

                    return null;
                }
            }


            function writeCache(key, data) {

                try {

                    localStorage.setItem(
                        key,
                        JSON.stringify(data)
                    );

                }
                catch (error) {

                    console.warn(
                        "Haproven Frame: Cache write failed.",
                        error
                    );
                }
            }


            function isValidCache(
                cache,
                maxAge
            ) {

                if (!cache) {
                    return false;
                }

                if (!cache.time) {
                    return false;
                }

                return (
                    Date.now() - cache.time
                    < maxAge
                );
            }


            /* =====================================================
               PROFILE CACHE KEY
            ===================================================== */

            function profileCacheKey(username) {

                return (
                    PROFILE_CACHE_PREFIX +
                    username.toLowerCase()
                );
            }


            /* =====================================================
               CREATE MEMBER CARD
            ===================================================== */

            function createMemberCard(
                contributor
            ) {

                const link =
                    document.createElement("a");


                link.className =
                    "haproven-member";


                link.href =
                    contributor.html_url ||
                    `https://github.com/${contributor.login}`;


                link.target =
                    "_blank";


                link.rel =
                    "noopener noreferrer";


                link.title =
                    `${contributor.name || contributor.login} — Haproven Contributor`;


                /* ================================================
                   PHOTO
                ================================================= */

                const image =
                    document.createElement("img");


                image.className =
                    "member-avatar";


                image.src =
                    contributor.avatar_url;


                image.alt =
                    `${contributor.name || contributor.login} — Haproven Contributor`;


                image.loading =
                    "lazy";


                image.referrerPolicy =
                    "no-referrer";


                /* ================================================
                   NAME
                ================================================= */

                const name =
                    document.createElement("div");


                name.className =
                    "member-name";


                name.textContent =
                    contributor.name ||
                    contributor.login;


                /* ================================================
                   USERNAME
                ================================================= */

                const username =
                    document.createElement("div");


                username.className =
                    "member-username";


                username.textContent =
                    `@${contributor.login}`;


                /* ================================================
                   BIO
                ================================================= */

                const bio =
                    document.createElement("div");


                bio.className =
                    "member-bio";


                if (contributor.bio) {

                    bio.textContent =
                        contributor.bio;

                }
                else {

                    bio.textContent =
                        "Haproven contributor";

                    bio.classList.add(
                        "no-bio"
                    );
                }


                /* ================================================
                   BOTTOM
                ================================================= */

                const bottom =
                    document.createElement("div");


                bottom.className =
                    "member-bottom";


                const github =
                    document.createElement("span");


                github.className =
                    "member-github";


                github.textContent =
                    "🐙 GitHub";


                const contributions =
                    document.createElement("span");


                contributions.className =
                    "member-contributions";


                contributions.textContent =
                    `${Number(contributor.contributions || 0).toLocaleString()} contributions`;


                bottom.appendChild(
                    github
                );


                bottom.appendChild(
                    contributions
                );


                /* ================================================
                   CARD
                ================================================= */

                link.appendChild(
                    image
                );


                link.appendChild(
                    name
                );


                link.appendChild(
                    username
                );


                link.appendChild(
                    bio
                );


                link.appendChild(
                    bottom
                );


                return link;
            }


            /* =====================================================
               RENDER
            ===================================================== */

            function renderContributors(
                contributors
            ) {

                if (
                    !Array.isArray(contributors) ||
                    contributors.length === 0
                ) {

                    frame.innerHTML = `

                <div class="frame-loading">
                    No contributors found yet.
                </div>

            `;

                    return;
                }


                frame.innerHTML = "";


                contributors.forEach(
                    contributor => {

                        frame.appendChild(
                            createMemberCard(
                                contributor
                            )
                        );

                    }
                );
            }


            /* =====================================================
               GITHUB CONTRIBUTORS API
            ===================================================== */

            async function fetchContributors() {

                const response =
                    await fetch(
                        `https://api.github.com/repos/${REPOSITORY}/contributors?per_page=100`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/vnd.github+json"
                            }
                        }
                    );


                if (!response.ok) {

                    const error =
                        new Error(
                            `GitHub Contributors API: ${response.status}`
                        );


                    error.status =
                        response.status;


                    throw error;
                }


                return await response.json();
            }


            /* =====================================================
               GITHUB PROFILE API
            ===================================================== */

            async function fetchProfile(
                username
            ) {

                const cacheKey =
                    profileCacheKey(
                        username
                    );


                /*
                 * FIRST:
                 * Check profile cache.
                 */

                const cached =
                    readCache(
                        cacheKey
                    );


                if (
                    isValidCache(
                        cached,
                        PROFILE_CACHE_TIME
                    )
                ) {

                    console.log(
                        `Haproven Frame: Cached profile → ${username}`
                    );


                    return cached.profile;
                }


                /*
                 * ONLY NOW:
                 * Hit GitHub API.
                 */

                try {

                    const response =
                        await fetch(
                            `https://api.github.com/users/${encodeURIComponent(username)}`,
                            {
                                method: "GET",

                                headers: {
                                    "Accept":
                                        "application/vnd.github+json"
                                }
                            }
                        );


                    if (!response.ok) {

                        console.warn(
                            `Haproven Frame: Profile ${username} → ${response.status}`
                        );


                        return null;
                    }


                    const profile =
                        await response.json();


                    /*
                     * Save profile for 7 days.
                     */

                    writeCache(
                        cacheKey,
                        {
                            time: Date.now(),
                            profile: profile
                        }
                    );


                    return profile;

                }
                catch (error) {

                    console.warn(
                        `Haproven Frame: Profile request failed → ${username}`,
                        error
                    );


                    return null;
                }
            }


            /* =====================================================
               ENRICH PROFILES
               
               IMPORTANT:
               Cached profiles = ZERO API request.
        
               New profiles = API request only once.
            ===================================================== */

            async function enrichContributors(
                contributors
            ) {

                const result = [];


                /*
                 * Process one by one.
                 *
                 * This avoids firing 20-50 API
                 * requests at the same time.
                 */

                for (
                    const contributor of contributors
                ) {

                    const cacheKey =
                        profileCacheKey(
                            contributor.login
                        );


                    const cached =
                        readCache(
                            cacheKey
                        );


                    /*
                     * =========================================
                     * CACHE AVAILABLE
                     * =========================================
                     */

                    if (
                        isValidCache(
                            cached,
                            PROFILE_CACHE_TIME
                        )
                    ) {

                        result.push({

                            ...contributor,

                            name:
                                cached.profile?.name ||
                                contributor.login,

                            bio:
                                cached.profile?.bio ||
                                "",

                            avatar_url:
                                cached.profile?.avatar_url ||
                                contributor.avatar_url,

                            html_url:
                                cached.profile?.html_url ||
                                contributor.html_url

                        });


                        /*
                         * NO API REQUEST
                         */

                        continue;
                    }


                    /*
                     * =========================================
                     * PROFILE NOT CACHED
                     * =========================================
                     */

                    const profile =
                        await fetchProfile(
                            contributor.login
                        );


                    result.push({

                        ...contributor,

                        name:
                            profile?.name ||
                            contributor.login,

                        bio:
                            profile?.bio ||
                            "",

                        avatar_url:
                            profile?.avatar_url ||
                            contributor.avatar_url,

                        html_url:
                            profile?.html_url ||
                            contributor.html_url

                    });


                    /*
                     * Small delay between uncached
                     * profile requests.
                     *
                     * This reduces request bursts.
                     */

                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                150
                            )
                    );
                }


                return result;
            }


            /* =====================================================
               MAIN LOADER
            ===================================================== */

            async function loadHaprovenFrame() {

                /*
                 * =========================================
                 * STEP 1
                 * Check contributors cache
                 * =========================================
                 */

                const cached =
                    readCache(
                        CONTRIBUTORS_CACHE
                    );


                if (
                    isValidCache(
                        cached,
                        CONTRIBUTORS_CACHE_TIME
                    ) &&
                    Array.isArray(
                        cached.contributors
                    )
                ) {

                    console.log(
                        "Haproven Frame: Using cached contributors."
                    );


                    /*
                     * Show immediately.
                     */

                    renderContributors(
                        cached.contributors
                    );


                    /*
                     * STOP.
                     *
                     * No background API request.
                     *
                     * This is what prevents the page
                     * from hitting GitHub every refresh.
                     */

                    return;
                }


                /*
                 * =========================================
                 * STEP 2
                 * No cache → GitHub API
                 * =========================================
                 */

                try {

                    console.log(
                        "Haproven Frame: Loading from GitHub..."
                    );


                    const contributors =
                        await fetchContributors();


                    if (
                        !Array.isArray(
                            contributors
                        ) ||
                        contributors.length === 0
                    ) {

                        throw new Error(
                            "No contributors returned."
                        );
                    }


                    /*
                     * =========================================
                     * STEP 3
                     * Show basic cards immediately
                     * =========================================
                     */

                    renderContributors(
                        contributors
                    );


                    /*
                     * =========================================
                     * STEP 4
                     * Get name + bio
                     *
                     * Cached profiles are NOT requested.
                     * =========================================
                     */

                    const enriched =
                        await enrichContributors(
                            contributors
                        );


                    /*
                     * =========================================
                     * STEP 5
                     * Update cards
                     * =========================================
                     */

                    renderContributors(
                        enriched
                    );


                    /*
                     * =========================================
                     * STEP 6
                     * Save for 24 hours
                     * =========================================
                     */

                    writeCache(
                        CONTRIBUTORS_CACHE,
                        {
                            time: Date.now(),
                            contributors: enriched
                        }
                    );


                    console.log(
                        "Haproven Frame: Data cached successfully."
                    );

                }
                catch (error) {

                    console.error(
                        "Haproven Frame Error:",
                        error
                    );


                    /*
                     * =========================================
                     * FALLBACK
                     *
                     * Even expired cache is better than
                     * showing an empty page.
                     * =========================================
                     */

                    const oldCache =
                        readCache(
                            CONTRIBUTORS_CACHE
                        );


                    if (
                        oldCache &&
                        Array.isArray(
                            oldCache.contributors
                        )
                    ) {

                        console.log(
                            "Haproven Frame: Using expired cache."
                        );


                        renderContributors(
                            oldCache.contributors
                        );


                        return;
                    }


                    /*
                     * =========================================
                     * FINAL ERROR
                     * =========================================
                     */

                    let message =
                        "Unable to load contributors.";


                    if (
                        error.status === 403
                    ) {

                        message =
                            "GitHub API rate limit reached.";

                    }
                    else if (
                        error.status === 404
                    ) {

                        message =
                            "Haproven repository was not found.";

                    }


                    frame.innerHTML = `

                <div class="frame-loading">

                    ${message}

                    <br><br>

                    <a
                        href="https://github.com/haproven/haproven/graphs/contributors"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View contributors on GitHub →
                    </a>

                </div>

            `;
                }
            }


            /* =====================================================
               START
            ===================================================== */

            loadHaprovenFrame();

        })();
    </script>


</body>
